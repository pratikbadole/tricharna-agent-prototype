<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>StrataMind — Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg0: "#0D0D0D", bg1:"#151515", text0:"#FFFFFF", text1:"#B0B0B0",
            brand: { 500:"#FF6B00", 400:"#FFB347" }, accent:{ 500:"#00C2FF" }
          },
          boxShadow: { glow:"0 0 24px rgba(255,107,0,.35)", glowLg:"0 0 36px rgba(255,107,0,.45)" },
          fontFamily: { sans:["Inter","ui-sans-serif","system-ui"], display:["Poppins","Inter"] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css" />
  <style>
    .btn-primary{background:linear-gradient(135deg,#FF6B00,#FFB347)}
    .field{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
  </style>
<link href="https://fonts.bunny.net/css?family=inter:400,500,600|poppins:700" rel="stylesheet">
<link rel="stylesheet" href="assets/tw.css">
</head>
<body class="bg-bg0 text-text0 min-h-screen">
  <!-- Top brand -->
  <header class="sticky top-0 z-10 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <img src="brand/stratamind-monogram.svg" alt="StrataMind" class="brand-logo">
      <img src="brand/stratamind-wordmark.svg" alt="StrataMind" class="brand-wordmark">
    </div>
    <div class="text-sm text-text1">AI IT Helpdesk</div>
  </header>

  <!-- Main split -->
  <main class="grid md:grid-cols-2 gap-0 items-stretch">
    <!-- Left visual -->
    <section class="hidden md:flex items-center justify-center p-10 relative overflow-hidden">
      <div class="absolute inset-0 opacity-30" style="background: radial-gradient(600px 400px at 20% -10%, rgba(255,107,0,.35), transparent), radial-gradient(600px 400px at 120% 110%, rgba(255,179,71,.25), transparent);"></div>
      <div class="glass p-10 rounded-2xl relative max-w-xl">
        <h1 class="font-display text-3xl md:text-4xl mb-3">Welcome to <span class="text-brand-400">StrataMind</span></h1>
        <p class="text-text1 leading-relaxed">Sleek, AI-powered IT helpdesk. Resolve issues faster with automated troubleshooting, smart ticketing, and a live knowledge engine.</p>
      </div>
    </section>

    <!-- Right auth card -->
    <section class="flex items-center justify-center p-6 md:p-10">
      <div class="glass w-full max-w-md p-6 md:p-8">
        <div class="flex gap-1 mb-6">
          <button id="tabLogin" class="flex-1 py-2 rounded-lg bg-[rgba(255,255,255,.06)] border border-[rgba(255,255,255,.18)] text-white">Login</button>
          <button id="tabRegister" class="flex-1 py-2 rounded-lg text-white/80 hover:text-white">Register</button>
        </div>

        <!-- Login form -->
        <form id="formLogin" class="space-y-4">
          <div>
            <label class="block text-sm text-text1 mb-1">Email</label>
            <input type="email" class="field w-full px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="you@company.com" required>
          </div>
          <div>
            <label class="block text-sm text-text1 mb-1">Password</label>
            <input type="password" class="field w-full px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••" required>
          </div>
          <div class="flex items-center justify-between">
            <a class="text-sm text-accent-500 hover:underline" href="#">Forgot password?</a>
          </div>
          <button class="btn-primary w-full py-2.5 rounded-lg shadow-glow hover:shadow-glowLg transition">Login</button>
        </form>

        <!-- Register form -->
        <form id="formRegister" class="space-y-4 hidden">
          <div>
            <label class="block text-sm text-text1 mb-1">Full name</label>
            <input type="text" class="field w-full px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="John Doe" required>
          </div>
          <div>
            <label class="block text-sm text-text1 mb-1">Email</label>
            <input type="email" class="field w-full px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="you@company.com" required>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-sm text-text1 mb-1">Password</label>
              <input type="password" class="field w-full px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••" required>
            </div>
            <div>
              <label class="block text-sm text-text1 mb-1">Confirm</label>
              <input type="password" class="field w-full px-3 py-2 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500" placeholder="••••••••" required>
            </div>
          </div>
          <button class="btn-primary w-full py-2.5 rounded-lg shadow-glow hover:shadow-glowLg transition">Create account</button>
        </form>

        <p class="mt-6 text-center text-sm text-text1">By continuing you agree to the <a href="#" class="text-accent-500 hover:underline">Terms</a>.</p>
      </div>
    </section>
  </main>

  <!-- Floating watermark (branding) -->
  <img src="brand/stratamind-monogram.svg" alt="StrataMind" class="brand-logo">

  <script>
    // simple tab toggle (UI only for now)
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const formLogin = document.getElementById('formLogin');
    const formRegister = document.getElementById('formRegister');
    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('bg-[rgba(255,255,255,.06)]','border','border-[rgba(255,255,255,.18)]');
      tabRegister.classList.remove('bg-[rgba(255,255,255,.06)]','border','border-[rgba(255,255,255,.18)]');
      formLogin.classList.remove('hidden'); formRegister.classList.add('hidden');
    });
    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('bg-[rgba(255,255,255,.06)]','border','border-[rgba(255,255,255,.18)]');
      tabLogin.classList.remove('bg-[rgba(255,255,255,.06)]','border','border-[rgba(255,255,255,.18)]');
      formRegister.classList.remove('hidden'); formLogin.classList.add('hidden');
    });
  </script>
</body>
</html>
