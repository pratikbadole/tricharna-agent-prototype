<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StrataMind — AI IT Helpdesk</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css" />
<link href="https://fonts.bunny.net/css?family=inter:400,500,600|poppins:700" rel="stylesheet">
<link rel="stylesheet" href="assets/tw.css">
<link href="https://fonts.bunny.net/css?family=inter:400,500,600|poppins:700" rel="stylesheet">
</head>

<body class="auth">
<div id="auth-shell">
  <!-- LEFT: Brand panel -->
  <section class="auth-pane brand-pane hidden md:flex flex-col justify-between p-10">
    <div class="flex items-center gap-3">
      <img src="brand/stratamind-monogram.svg" alt="StrataMind" class="w-9 h-9 drop-shadow" />
      <div class="text-white/90 font-semibold tracking-wide">StrataMind</div>
    </div>

    <div class="px-2">
      <h1 class="font-display text-4xl md:text-5xl text-white leading-tight">
        Discover the transformative power of
        <span class="block text-brand-400">AI Helpdesk</span>
      </h1>
      <p class="text-text1 mt-4 max-w-md">
        AI-powered IT support for the future. Faster resolutions, smarter routing, delightful UX.
      </p>
    </div>

    <div></div>
  </section>

  <!-- RIGHT: Auth panel -->
  <section class="auth-pane auth-right">
    <div class="w-full max-w-md">
      <div class="glass shadow-glow p-6 md:p-8 space-y-4">
        <div class="text-center">
          <h2 class="font-display text-3xl text-white">
            Login to <span class="text-brand-400">StrataMind</span>
          </h2>
          <p class="text-xs text-text1 mt-2">Sign in to open, track, and resolve IT issues faster.</p>
        </div>

        <form id="loginForm" class="space-y-3" autocomplete="on">
          <input id="email" type="email" placeholder="you@company.com" class="input" required>
          <div class="relative">
            <input id="password" type="password" placeholder="Password" class="input pr-10" required>
            <button type="button" id="togglePw" aria-label="Show password"
              class="absolute inset-y-0 right-0 px-3 text-text1 hover:text-white/90">👁️</button>
          </div>
          <button type="submit" class="btn-primary">Login</button>
          <div class="flex justify-between text-xs text-text1">
            <a href="#" class="hover:text-white/80">Forgot password?</a>
            <a href="#" id="goRegister" class="hover:text-white/80">Create account</a>
          </div>
          <p class="text-[11px] text-center text-text1 mt-2">
            Demo — <span class="text-white">john@tricharna.com</span> / <span class="text-white">demo123</span>
          </p>
        </form>

        <form id="registerForm" class="space-y-3 hidden" autocomplete="on">
          <input id="regName"  type="text"     placeholder="Full name"        class="input" required>
          <input id="regEmail" type="email"    placeholder="you@company.com"  class="input" required>
          <input id="regPw"    type="password" placeholder="Password"         class="input" required>
          <input id="regPw2"   type="password" placeholder="Confirm password" class="input" required>
          <button type="button" id="goLogin" class="text-xs text-text1 hover:text-white/80">
            Already have an account? Login
          </button>
          <button type="submit" class="btn-primary mt-1">Create Account</button>
        </form>
      </div>
    </div>
  </section>
</div>

<script>
  // password show/hide
  const pw = document.getElementById('password');
  const toggle = document.getElementById('togglePw');
  if (toggle && pw) toggle.addEventListener('click', () => { pw.type = (pw.type === 'password' ? 'text' : 'password'); });

  // login <-> register
  const lf = document.getElementById('loginForm');
  const rf = document.getElementById('registerForm');
  const toReg = document.getElementById('goRegister');
  const toLog = document.getElementById('goLogin');
  if (toReg && toLog && lf && rf) {
    toReg.addEventListener('click', (e)=>{ e.preventDefault(); lf.classList.add('hidden'); rf.classList.remove('hidden'); });
    toLog.addEventListener('click', (e)=>{ e.preventDefault(); rf.classList.add('hidden'); lf.classList.remove('hidden'); });
  }
</script>
</body>

</html>
