<body class="antialiased bg-bg0 flex items-center justify-center min-h-screen text-text0">

  <!-- Login Screen -->
  <section id="loginScreen" class="screen screen--login">
    <div class="login-card">

      

<div id="auth-hero" class="min-h-screen grid place-items-center relative overflow-hidden">
  <!-- subtle radial + grid background -->
  <div class="absolute inset-0 bg-[radial-gradient(600px_circle_at_center,rgba(255,107,0,.10),transparent_60%)]"></div>
  <div class="absolute inset-0 pointer-events-none opacity-[.04] bg-[linear-gradient(to_right,#fff_1px,transparent_1px),linear-gradient(to_bottom,#fff_1px,transparent_1px)] bg-[size:44px_44px]"></div>

  <div class="relative w-full max-w-xl px-6">
    <div class="mb-6 text-center">
      <h1 class="font-display text-3xl md:text-4xl text-white">
        <span class="block">Access Premium</span>
        <span class="block text-brand-400">Support</span>
      </h1>
      <p class="text-text1 text-sm mt-2">Sign in to StrataMind to open, track, and resolve IT issues faster.</p>
    </div>

    <form id="loginForm" class="glass p-6 md:p-8 rounded-2xl shadow-glow space-y-4">
      <label class="block">
        <span class="sr-only">Email</span>
        <input id="email" type="email" placeholder="you@company.com"
          class="w-full px-3 py-2 rounded-lg bg-bg1 border border-text1 text-white placeholder:text-text1/70 focus:outline-none focus:ring-2 focus:ring-brand-500" required>
      </label>

      <label class="block">
        <span class="sr-only">Password</span>
        <input id="password" type="password" placeholder="Password"
          class="w-full px-3 py-2 rounded-lg bg-bg1 border border-text1 text-white placeholder:text-text1/70 focus:outline-none focus:ring-2 focus:ring-brand-500" required>
      </label>

      <button type="submit"
        class="w-full py-3 rounded-lg bg-brand-500 hover:bg-brand-400 text-white transition shadow-glow">Login</button>

      <p class="text-xs text-text1 mt-2 text-center">Demo — <span class="text-white">john@tricharna.com</span> / <span class="text-white">demo123</span></p>
    </form>
  </div>

  <!-- glowing watermark -->
  <img src="brand/stratamind-monogram.svg" alt="StrataMind" class="logo-watermark">
</div>
<script>
  // Add a body class on the login screen and hide legacy header/nav bits
  if (document.getElementById('loginForm')) {
    document.body.classList.add('login');
  }
</script>


    </div>
  </section>

  <!-- Main App -->
  <section id="mainApp" class="screen screen--app" style="display:none">

    <main class="app-main">
      <!-- Chat View -->
      <section id="chatView" class="view" data-view="chat" style="display:block">
        <div class="chat-layout">
          <div class="chat-pane">
            <div id="chatMessages" class="glass" class="glass" class="chat-messages" aria-live="polite"></div>
            <form id="chatForm" class="chat-form">
              <textarea id="chatInput" rows="2" placeholder="Ask me anything about tickets, knowledge, or weather…"></textarea>
              <button type="submit" class="btn btn--primary">Send</button>
            </form>
          </div>
          <aside class="side-pane">
            <div class="card">
              <h3>Weather</h3>
              <div id="weatherPanel" class="weather-panel">
                <label class="form-label" for="weatherCity">City</label>
                <input id="weatherCity" placeholder="Berlin" />
                <button id="weatherFetchBtn" class="btn btn--ghost">Get Weather</button>
                <pre id="weatherOutput" class="weather-output">—</pre>
              </div>
            </div>
          </aside>
        </div>
      </section>

      <!-- Tickets View -->
      <section id="ticketsView" class="view" data-view="tickets" style="display:none">
        <div class="toolbar">
          <button id="createTicketBtn" class="btn btn--primary">+ Create Ticket</button>
        </div>
        <div id="ticketsContainer" class="tickets"></div>
      </section>

      <!-- Knowledge View -->
      <section id="knowledgeView" class="view" data-view="knowledge" style="display:none">
        <div class="toolbar">
          <input id="knowledgeSearch" placeholder="Search knowledge…" />
          <div class="filters">
            <button class="filter-btn" data-cat="all">All</button>
            <button class="filter-btn" data-cat="email">Email</button>
            <button class="filter-btn" data-cat="vpn">VPN</button>
            <button class="filter-btn" data-cat="hardware">Hardware</button>
          </div>
        </div>
        <div id="knowledgeContainer" class="knowledge"></div>
      </section>
    </main>
  </section>

  <!-- App code (ES module) -->
  <script type="module" src="./app.js"></script>
  <script type="module" src="./knowledge.js"></script>
