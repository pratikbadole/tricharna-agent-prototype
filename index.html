<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StrataMind – Login</title>
  <link rel="stylesheet" href="assets/tw.css">
  <link rel="stylesheet" href="assets/overrides.css">
</head>
<body class="login-grid min-h-screen flex items-center justify-center px-6">
  <main class="w-full max-w-6xl grid md:grid-cols-2 gap-10 items-stretch">
    <!-- LEFT: brand hero -->
    <section class="glass-shell rounded-2xl shadow-glow p-8 md:p-10 flex flex-col justify-center min-h-[420px]">
      <div class="brand-chip mb-6 w-fit">
        <img src="brand/sm-monogram.svg" alt="StrataMind" class="h-8 w-8 rounded">
        <span class="font-display text-white/90 text-xl">StrataMind</span>
      </div>
      <h1 class="font-display text-white text-4xl md:text-5xl leading-tight">
        AI-Powered IT Helpdesk<br><span class="text-brand-400">for the Future</span>
      </h1>
      <p class="text-text1 mt-4 max-w-md">
        Reimagining IT support with intelligent automation, faster resolutions, and a delightful user experience.
      </p>
    </section>

    <!-- RIGHT: auth panel -->
    <section class="glass-shell rounded-2xl shadow-glow p-6 md:p-8 flex flex-col justify-center min-h-[420px]">
      <form id="loginForm" class="space-y-4">
        <h2 class="text-2xl font-display text-brand-400">Login to StrataMind</h2>

        <label class="block">
          <span class="sr-only">Email</span>
          <input id="email" type="email" placeholder="you@company.com"
            class="w-full px-4 py-3 rounded-lg bg-bg1 border border-text1 text-white placeholder:text-text1/70 focus:outline-none focus:ring-2 focus:ring-brand-500" required>
        </label>

        <div class="relative">
          <label class="sr-only" for="password">Password</label>
          <input id="password" type="password" placeholder="Password"
            class="w-full px-4 py-3 pr-12 rounded-lg bg-bg1 border border-text1 text-white placeholder:text-text1/70 focus:outline-none focus:ring-2 focus:ring-brand-500" required>
          <button type="button" id="togglePass" class="eye-btn absolute right-3 top-1/2 -translate-y-1/2 text-text1">👁️</button>
        </div>

        <button type="submit"
          class="w-full py-3 rounded-lg bg-gradient-to-r from-brand-500 to-brand-400 hover:shadow-glowLg text-white font-semibold transition">
          Login
        </button>

        <div class="text-sm text-text1 flex justify-between">
          <a href="#" class="hover:underline">Forgot password?</a>
          <a href="register.html" class="hover:underline">Create account</a>
        </div>
      </form>
    </section>
  </main>

  <!-- subtle watermark -->
  <img src="brand/sm-monogram.svg" alt="StrataMind" class="logo-watermark">

  <script>
    document.getElementById("togglePass")?.addEventListener("click", () => {
      const p = document.getElementById("password");
      if (p) p.type = p.type === "password" ? "text" : "password";
    });
    document.getElementById("loginForm")?.addEventListener("submit", (e) => {
      e.preventDefault();
      window.location.href = "home.html";
    });
  </script>
</body>
</html>
