  <!-- Keep canvas behind content -->
  <style>
    #bg-net { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .page   { position: relative; z-index: 1; }
    body::before, .page::before { z-index: -2 !important; }
  </style>
</head>
<body class="antialiased text-white page">
  <!-- Background mesh canvas -->
  <canvas id="bg-net"></canvas>

  <!-- Fallback: ensure canvas exists on slow DOMs -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (!document.getElementById('bg-net')) {
        const c = document.createElement('canvas');
        c.id = 'bg-net';
        document.body.prepend(c);
      }
    });
  </script>

  <main class="page min-h-screen">
